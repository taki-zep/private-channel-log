        // ============ 批量选择相关函数 ============

        function toggleOrderSelect(orderId, checked) {
            if (checked) {
                selectedOrderIds.add(orderId);
            } else {
                selectedOrderIds.delete(orderId);
            }
            updateSelectAllCheckbox();
            updateSelectionUI();
        }

        function toggleSelectAll(checked) {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageOrders = filteredOrders.slice(start, end);

            pageOrders.forEach(order => {
                if (checked) {
                    selectedOrderIds.add(order.oid);
                } else {
                    selectedOrderIds.delete(order.oid);
                }
            });

            renderTable();
            updateSelectionUI();
        }

        function updateSelectAllCheckbox() {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageOrders = filteredOrders.slice(start, end);

            if (pageOrders.length === 0) {
                document.getElementById('selectAllCheckbox').checked = false;
                document.getElementById('selectAllCheckbox').indeterminate = false;
                return;
            }

            const allSelected = pageOrders.every(order => selectedOrderIds.has(order.oid));
            const someSelected = pageOrders.some(order => selectedOrderIds.has(order.oid));

            document.getElementById('selectAllCheckbox').checked = allSelected;
            document.getElementById('selectAllCheckbox').indeterminate = someSelected && !allSelected;
        }

        function updateSelectionUI() {
            const count = selectedOrderIds.size;
            document.getElementById('selectedCount').textContent = count;
            document.getElementById('batchExportBtn').disabled = count === 0;
            document.getElementById('clearSelectionLink').style.display = count > 0 ? '' : 'none';
        }

        function clearSelection() {
            selectedOrderIds.clear();
            renderTable();
            updateSelectionUI();
        }

        // ============ 批量导出函数 ============

        function exportSelectedOrders() {
            if (selectedOrderIds.size === 0) {
                showToast('请先选择要导出的订单', 'warn');
                return;
            }

            if (typeof JSZip === 'undefined') {
                alert('❌ JSZip 库加载失败，请检查网络连接后刷新页面重试');
                return;
            }

            const selectedOrders = filteredOrders.filter(o => selectedOrderIds.has(o.oid));

            if (selectedOrders.length === 0) {
                showToast('未找到已选择的订单数据', 'warn');
                return;
            }

            if (selectedOrders.length === 1) {
                exportSingleOrderAsZip(selectedOrders[0]);
                return;
            }

            try {
                const masterZip = new JSZip();
                const dateStr = formatDate(new Date());

                const zipPromises = selectedOrders.map(order => {
                    const zipName = (order.coid || order.oid || 'unknown') + '.zip';
                    const orderZip = buildOrderZip(order);
                    return orderZip.generateAsync({ type: 'blob' }).then(blob => {
                        masterZip.file(zipName, blob);
                    });
                });

                Promise.all(zipPromises).then(() => {
                    return masterZip.generateAsync({ type: 'blob' });
                }).then(blob => {
                    downloadBlob(blob, 'channel_logs_batch_' + dateStr + '.zip');
                    showToast('✅ 已导出 ' + selectedOrders.length + ' 个订单的日志');
                }).catch(err => {
                    alert('❌ 导出失败: ' + err.message);
                });
            } catch (err) {
                alert('❌ 导出失败: ' + err.message);
            }
        }

        function exportOrder(orderId) {
            const order = filteredOrders.find(o => o.oid === orderId);
            if (!order) { alert('未找到该订单数据'); return; }
            exportSingleOrderAsZip(order);
        }

        // Toast 提示
        function showToast(msg, type) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast' + (type === 'warn' ? ' warn' : '');
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2500);
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function shareLink() {
            const params = new URLSearchParams();

            const orderId = document.getElementById('orderNumber').value.trim();
            const startDate = document.getElementById('dateInputStart').value.trim();
            const endDate = document.getElementById('dateInputEnd').value.trim();
            const logTypes = getSelectedLogTypes().join(',');

            if (orderId) params.set('orderNumber', orderId);
            if (startDate) params.set('dateStart', startDate);
            if (endDate) params.set('dateEnd', endDate);
            if (logTypes && logTypes !== 'verify,order,cancel,query') params.set('logTypes', logTypes);

            const clientId = document.getElementById('clientId').value.trim();
            const supplierId = document.getElementById('supplierId').value.trim();
            const errorCode = document.getElementById('errorCode').value.trim();
            const didaHotelId = document.getElementById('didaHotelId').value.trim();
            const ratePlanId = document.getElementById('ratePlanId').value.trim();

            if (clientId) params.set('clientId', clientId);
            if (supplierId) params.set('supplierId', supplierId);
            if (errorCode) params.set('errorCode', errorCode);
            if (didaHotelId) params.set('didaHotelId', didaHotelId);
            if (ratePlanId) params.set('ratePlanId', ratePlanId);

            const url = window.location.origin + window.location.pathname + (params.toString() ? '?' + params.toString() : '');

            navigator.clipboard.writeText(url).then(() => {
                showToast('✅ 分享链接已复制');
            }).catch(() => {
                showToast('✅ 分享链接已复制');
            });
        }

        function exportLogs() {
            if (!filteredOrders || filteredOrders.length === 0) {
                alert('没有可导出的日志数据');
                return;
            }

            if (typeof JSZip === 'undefined') {
                alert('❌ JSZip 库加载失败，请检查网络连接后刷新页面重试');
                return;
            }

            if (filteredOrders.length === 1) {
                exportSingleOrderAsZip(filteredOrders[0]);
                return;
            }

            try {
                const masterZip = new JSZip();
                const dateStr = formatDate(new Date());

                const zipPromises = filteredOrders.map(order => {
                    const zipName = (order.coid || order.oid || 'unknown') + '.zip';
                    const orderZip = buildOrderZip(order);
                    return orderZip.generateAsync({ type: 'blob' }).then(blob => {
                        masterZip.file(zipName, blob);
                    });
                });

                Promise.all(zipPromises).then(() => {
                    return masterZip.generateAsync({ type: 'blob' });
                }).then(blob => {
                    downloadBlob(blob, 'channel_logs_' + dateStr + '.zip');
                }).catch(err => {
                    alert('❌ 导出失败: ' + err.message);
                });
            } catch (err) {
                alert('❌ 导出失败: ' + err.message);
            }
        }

        // 导出单个订单为 zip（按日志类型拆分为 txt）
        function exportSingleOrderAsZip(order) {
            if (typeof JSZip === 'undefined') {
                alert('❌ JSZip 库加载失败，请检查网络连接后刷新页面重试');
                return;
            }
            try {
                const zip = buildOrderZip(order);
                const fileName = (order.coid || order.oid || 'unknown') + '.zip';
                zip.generateAsync({ type: 'blob' }).then(blob => {
                    downloadBlob(blob, fileName);
                }).catch(err => {
                    alert(' 导出失败: ' + err.message);
                });
            } catch (err) {
                alert('❌ 导出失败: ' + err.message);
            }
        }

        // 构建单个订单的 zip（仅包含客户到Dida的请求日志）
        function buildOrderZip(order) {
            const zip = new JSZip();

            // 添加订单元信息
            const meta = [
                'ClientOrderID: ' + (order.coid || '-'),
                'DidaOrderID: ' + (order.oid || '-'),
                'SupplierOrderID: ' + (order.soid || '-'),
                'Status: ' + order.status,
                'ClientID: ' + (order.clientId || '-'),
                'SupplierID: ' + (order.supplierId || '-'),
                'LastUpdateTime: ' + (order.time || '-'),
                ''
            ].join('\n');
            zip.file('meta.txt', meta);

            // 按日志类型分组
            const groupedLogs = {};
            order.logs.forEach(log => {
                if (!groupedLogs[log.lt]) groupedLogs[log.lt] = [];
                groupedLogs[log.lt].push(log);
            });

            const typeLabel = { verify: '验价', order: '下单', cancel: '取消', query: '查单' };

            Object.entries(groupedLogs).forEach(([lt, logs]) => {
                const label = typeLabel[lt] || lt;
                let content = '';

                logs.forEach((log, idx) => {
                    content += '═══════════════════════════════════════════════════════\n';
                    content += 'Log #' + (idx + 1) + ' | ' + label + ' | ' + log.t + '\n';
                    content += 'Status: ' + log.st + (log.ec ? ' | ErrorCode: ' + log.ec : '') + '\n';
                    content += 'SessionID: ' + (log.ss || '-') + '\n';
                    content += '═══════════════════════════════════════════════════════\n\n';

                    // 仅包含机构客户→Dida的请求
                    content += '─────── 机构客户 → Dida (Request) ───────\n\n';
                    content += buildClientRequest(log) + '\n\n';
                });

                zip.file(label + '.txt', content);
            });

            return zip;
        }

        // 下载 blob 文件
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // 点击外部关闭日期面板和日志类型下拉框
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('datePickerPanel');
            const container = document.querySelector('.date-range-container');
            const dayCell = e.target.closest('.calendar-day:not(.other-month)');
            if (dayCell && dayCell.dataset.dateStr && panel && panel.classList.contains('show')) {
                handleDateClick(dayCell.dataset.dateStr);
                return;
            }
            if (panel && container && !container.contains(e.target)) {
                panel.classList.remove('show');
                clearInputFocus();
            }

            const msContainer = document.getElementById('logTypeMultiSelect');
            const msDropdown = document.getElementById('logTypeDropdown');
            if (msContainer && !msContainer.contains(e.target)) {
                msDropdown.classList.remove('show');
            }
        });

        // Initialize date range on page load and auto-search
        const urlParams = new URLSearchParams(window.location.search);

        const initToday = new Date();
        initToday.setHours(0, 0, 0, 0);
        const initStart = new Date(initToday);
        initStart.setDate(initStart.getDate() - 29);
        selectedStart = initStart;
        selectedEnd = initToday;
        calLeftYear = initStart.getFullYear();
        calLeftMonth = initStart.getMonth();

        // 从 URL 参数恢复搜索条件
        if (urlParams.has('dateStart') && urlParams.has('dateEnd')) {
            const urlStart = urlParams.get('dateStart');
            const urlEnd = urlParams.get('dateEnd');
            document.getElementById('dateInputStart').value = urlStart;
            document.getElementById('dateInputEnd').value = urlEnd;
            const sParts = urlStart.split('-').map(Number);
            const eParts = urlEnd.split('-').map(Number);
            selectedStart = new Date(sParts[0], sParts[1] - 1, sParts[2]);
            selectedEnd = new Date(eParts[0], eParts[1] - 1, eParts[2]);
            calLeftYear = sParts[0];
            calLeftMonth = sParts[1] - 1;
        } else {
            document.getElementById('dateInputStart').value = formatDate(initStart);
            document.getElementById('dateInputEnd').value = formatDate(initToday);
        }

        if (urlParams.has('orderNumber')) {
            document.getElementById('orderNumber').value = urlParams.get('orderNumber');
        }

        if (urlParams.has('logTypes')) {
            const types = urlParams.get('logTypes').split(',');
            const allTypes = ['verify', 'order', 'cancel', 'query'];
            document.querySelectorAll('input[name="logType"]').forEach(cb => {
                cb.checked = types.includes(cb.value);
            });
            const allCb = document.getElementById('logTypeAllCheck');
            allCb.checked = types.length === allTypes.length;
            updateLogTypeDisplay();
        }

        if (urlParams.has('clientId')) document.getElementById('clientId').value = urlParams.get('clientId');
        if (urlParams.has('supplierId')) document.getElementById('supplierId').value = urlParams.get('supplierId');
        if (urlParams.has('errorCode')) document.getElementById('errorCode').value = urlParams.get('errorCode');
        if (urlParams.has('didaHotelId')) document.getElementById('didaHotelId').value = urlParams.get('didaHotelId');
        if (urlParams.has('ratePlanId')) document.getElementById('ratePlanId').value = urlParams.get('ratePlanId');

        // 如果有高级筛选参数，自动展开
        if (urlParams.has('clientId') || urlParams.has('supplierId') || urlParams.has('errorCode') || urlParams.has('didaHotelId') || urlParams.has('ratePlanId')) {
            document.getElementById('advancedFilters').classList.add('show');
            document.getElementById('toggleAdvanced').classList.add('open');
            document.getElementById('toggleAdvanced').innerHTML = '收起更多筛选条件 <span class="arrow" style="transform:rotate(180deg)">▼</span>';
        }

        renderCalendar();
        updateLogTypeDisplay();

        // Only auto-search if URL params contain explicit search criteria (orderNumber or dateStart/End or logTypes)
        if (urlParams.has('orderNumber') || urlParams.has('dateStart') || urlParams.has('logTypes')) {
            searchLogs();
        }
    </script>
