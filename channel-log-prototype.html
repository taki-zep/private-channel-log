<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渠道日志系统 - 道旅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #F2F4F7;
            color: #1F2329;
            font-size: 14px;
        }

        .header {
            background: #fff;
            border-bottom: 1px solid #E8EAEF;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: #2E5BE6;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8F959E;
        }

        .breadcrumb-separator {
            color: #D8DBE1;
        }

        .main-container {
            display: flex;
            min-height: calc(100vh - 60px);
        }

        .sidebar {
            width: 220px;
            background: #fff;
            border-right: 1px solid #E8EAEF;
            padding: 16px 0;
        }

        .nav-item {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #646A73;
        }

        .nav-item.active {
            background: #EEF3FE;
            color: #2E5BE6;
            border-right: 2px solid #2E5BE6;
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        .search-panel {
            background: #fff;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #E8EAEF;
            overflow: visible;
        }

        .search-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            overflow: visible;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row.span-2 {
            grid-column: span 2;
        }

        .form-row.span-3 {
            grid-column: span 3;
        }

        .form-row.span-6 {
            grid-column: 1 / -1;
        }

        /* 日志类型多选下拉框 */
        .multi-select {
            position: relative;
            height: 32px;
        }

        .multi-select-trigger {
            height: 32px;
            border: 1px solid #D8DBE1;
            border-radius: 6px;
            padding: 0 28px 0 10px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            background: #fff;
            position: relative;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: border-color 0.2s;
        }

        .multi-select-trigger:hover {
            border-color: #2E5BE6;
        }

        .multi-select-trigger::after {
            content: '';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #8F959E;
        }

        .multi-select-dropdown {
            display: none;
            position: absolute;
            top: 36px;
            left: 0;
            background: #fff;
            border: 1px solid #E8EAEF;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(31,35,41,0.08);
            padding: 8px 0;
            z-index: 100;
            min-width: 160px;
        }

        .multi-select-dropdown.show {
            display: block;
        }

        .multi-select-dropdown label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 13px;
            color: #1F2329;
            cursor: pointer;
            user-select: none;
        }

        .multi-select-dropdown label:hover {
            background: #F2F4F7;
        }

        .multi-select-dropdown label input[type="checkbox"] {
            accent-color: #2E5BE6;
            width: 14px;
            height: 14px;
        }

        .multi-select-dropdown .ms-divider {
            border-top: 1px solid #E8EAEF;
            margin: 4px 0;
        }

        .advanced-filters {
            display: none;
        }

        .advanced-filters.show {
            display: contents;
        }

        .toggle-advanced {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0 4px;
            cursor: pointer;
            color: #2E5BE6;
            font-size: 13px;
            user-select: none;
            margin-top: -8px;
        }

        .toggle-advanced:hover {
            color: #1F48C4;
        }

        .toggle-advanced .arrow {
            display: inline-block;
            transition: transform 0.2s;
            margin-left: 4px;
        }

        .toggle-advanced.open .arrow {
            transform: rotate(180deg);
        }

        .form-label {
            font-size: 13px;
            color: #646A73;
        }

        .form-input,
        .form-select {
            height: 32px;
            border: 1px solid #D8DBE1;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 14px;
            width: 100%;
        }

        .form-input:focus {
            border-color: #2E5BE6;
            outline: none;
        }

        .form-select {
            height: 32px;
            border: 1px solid #D8DBE1;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 14px;
            background: #fff;
            width: 100%;
        }

        /* 日期范围选择器 - Ant Design 风格 */
        .date-range-container {
            position: relative;
        }

        .date-range-input {
            height: 32px;
            border: 1px solid #D8DBE1;
            border-radius: 6px;
            padding: 0 32px 0 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
            background: #fff;
            position: relative;
            transition: border-color 0.2s;
        }

        .date-range-input:hover, .date-range-input.focused {
            border-color: #2E5BE6;
        }

        .date-range-input .range-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #1F2329;
            height: 100%;
            width: 0;
            padding: 0;
        }

        .date-range-input .range-input::placeholder {
            color: #D8DBE1;
        }

        .date-range-input .range-input.active {
            color: #2E5BE6;
        }

        .date-range-input .range-separator {
            display: flex;
            align-items: center;
            padding: 0 8px;
            color: #D8DBE1;
            flex-shrink: 0;
        }

        .date-range-input .range-separator svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .date-range-input .range-calendar-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            color: #8F959E;
            pointer-events: none;
        }

        .date-range-input .range-calendar-icon svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .date-picker-panel {
            display: none;
            position: absolute;
            top: 38px;
            left: 0;
            background: #fff;
            border: 1px solid #E8EAEF;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(31,35,41,0.1);
            padding: 12px 16px 16px;
            z-index: 100;
            min-width: 640px;
        }

        .date-picker-panel.show {
            display: block;
        }

        .quick-date-options {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #E8EAEF;
        }

        .quick-date-btn {
            padding: 4px 12px;
            border: 1px solid #E8EAEF;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            color: #646A73;
            transition: all 0.2s;
        }

        .quick-date-btn:hover {
            color: #2E5BE6;
            border-color: #2E5BE6;
        }

        .quick-date-btn.active {
            background: #2E5BE6;
            color: #fff;
            border-color: #2E5BE6;
        }

        .calendar-container {
            display: flex;
            gap: 16px;
        }

        .calendar-month {
            flex: 1;
            min-width: 240px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: #f7f8fa;
            border-radius: 6px;
        }

        .calendar-header-title {
            font-size: 14px;
            font-weight: 600;
            color: #1F2329;
            min-width: 100px;
            text-align: center;
        }

        .calendar-nav {
            display: flex;
            gap: 4px;
        }

        .calendar-nav-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #E8EAEF;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #646A73;
        }

        .calendar-nav-btn:hover {
            border-color: #2E5BE6;
            color: #2E5BE6;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .calendar-weekday {
            text-align: center;
            font-size: 12px;
            color: #8F959E;
            padding: 8px 0;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            height: 36px;
        }

        .calendar-day:hover {
            background: #F2F4F7;
        }

        .calendar-day.other-month {
            color: #D8DBE1;
        }

        .calendar-day.today {
            border: 1px solid #2E5BE6;
            color: #2E5BE6;
            font-weight: 600;
        }

        .calendar-day.selected {
            background: #2E5BE6;
            color: #fff;
            font-weight: 500;
        }

        .calendar-day.in-range {
            background: #EEF3FE;
        }

        .calendar-day.weekend {
            color: #CF3A31;
        }

        /* 按钮 */
        .btn-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .btn {
            height: 36px;
            padding: 0 24px;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #E8EAEF;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .btn-primary {
            background: #2E5BE6;
            color: #fff;
            border-color: #2E5BE6;
        }

        .btn-primary:hover {
            background: #1F48C4;
        }

        .btn-default {
            background: #fff;
            color: #2E5BE6;
            border-color: #E8EAEF;
        }

        .btn-default:hover {
            border-color: #2E5BE6;
            background: #f7f8fa;
        }

        /* 结果表格 */
        .result-panel {
            background: #fff;
            border-radius: 6px;
            border: 1px solid #E8EAEF;
            overflow: hidden;
        }

        .result-header {
            padding: 16px 20px;
            border-bottom: 1px solid #E8EAEF;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;
        }

        .table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: #f7f8fa;
            padding: 12px 16px;
            text-align: left;
            font-weight: 500;
            color: #646A73;
            border-bottom: 1px solid #E8EAEF;
        }

        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #E8EAEF;
        }

        .data-table tr:hover {
            background: #f7f8fa;
        }

        .log-type-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-right: 4px;
            border: 1px solid;
        }

        .log-type-verify { background: #EEF3FE; color: #2E5BE6; border-color: #BFD4F5; }
        .log-type-order { background: #E8F6ED; color: #16A34A; border-color: #C7E8D2; }
        .log-type-cancel { background: #FEF4E6; color: #D97706; border-color: #F0DCBB; }
        .log-type-query { background: #F0E6F6; color: #7B2D8E; border-color: #D4A8E3; }

        .order-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .order-status-cancelled { background: #FEF4E6; color: #D97706; border: 1px solid #F0DCBB; }
        .order-status-confirmed { background: #E8F6ED; color: #16A34A; border: 1px solid #C7E8D2; }
        .order-status-failed { background: #FDECEA; color: #CF3A31; border: 1px solid #EFB9B5; }

        .log-content {
            font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            background: #f7f8fa;
            padding: 8px;
            border-radius: 6px;
            max-width: 400px;
            max-height: 80px;
            overflow-y: auto;
        }

        .action-link {
            color: #2E5BE6;
            cursor: pointer;
            text-decoration: none;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding: 16px 20px;
            border-top: 1px solid #E8EAEF;
        }

        .pagination-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #D8DBE1;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        .pagination-btn.active {
            background: #2E5BE6;
            border-color: #2E5BE6;
            color: #fff;
        }

        .page-size-select {
            height: 28px;
            border: 1px solid #D8DBE1;
            border-radius: 6px;
            background: #fff;
            font-size: 13px;
            color: #646A73;
            cursor: pointer;
            outline: none;
            padding: 0 6px;
        }

        /* 链路追踪 */
        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(31,35,41,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #E8EAEF;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 24px;
            color: #666;
        }
        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            padding: 0;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid #E8EAEF;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* 详情弹窗 - 基本信息区 */
        .detail-info-bar {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 16px 20px;
            background: #f7f8fa;
            border-bottom: 1px solid #E8EAEF;
            flex-wrap: wrap;
        }
        .detail-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .detail-info-label {
            font-size: 12px;
            color: #8F959E;
        }
        .detail-info-value {
            font-size: 13px;
            color: #1F2329;
            font-weight: 500;
            font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        }
        .detail-info-value.status-confirmed {
            color: #16A34A;
            background: #E8F6ED;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .detail-info-value.status-cancelled {
            color: #CF3A31;
            background: #FDECEA;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .detail-info-value.status-failed {
            color: #D97706;
            background: #FEF4E6;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .detail-info-value.status-verifying {
            color: #2E5BE6;
            background: #EEF3FE;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* 详情弹窗 - 双栏布局 */
        .detail-columns {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .detail-column {
            flex: 1;
            border-right: 1px solid #E8EAEF;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .detail-column:last-child {
            border-right: none;
        }
        .detail-column-header {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #1F2329;
            background: #F7F8FA;
            border-bottom: 1px solid #E8EAEF;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .detail-column-header .col-icon {
            font-size: 15px;
        }
        .detail-column-body {
            padding: 12px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        /* 详情弹窗 - 日志卡片 */
        .log-card {
            border: 1px solid #E8EAEF;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: box-shadow 0.15s;
        }
        .log-card:hover {
            box-shadow: 0 2px 8px rgba(31,35,41,0.06);
        }
        .log-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            background: #fff;
            transition: background 0.15s;
        }
        .log-card-header:hover {
            background: #f7f8fa;
        }
        .log-card-toggle {
            font-size: 10px;
            color: #8F959E;
            transition: transform 0.2s;
            width: 14px;
            text-align: center;
        }
        .log-card.expanded .log-card-toggle {
            transform: rotate(90deg);
        }
        .log-card-type {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }
        .log-card-type.verify { background: #EEF3FE; color: #2E5BE6; }
        .log-card-type.order { background: #E8F6ED; color: #16A34A; }
        .log-card-type.cancel { background: #FDECEA; color: #CF3A31; }
        .log-card-type.query { background: #F0E6F6; color: #7B2D8E; }
        .log-card-status {
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 4px;
        }
        .log-card-status.success { background: #E8F6ED; color: #16A34A; }
        .log-card-status.fail { background: #FDECEA; color: #CF3A31; }
        .log-card-time {
            font-size: 11px;
            color: #8F959E;
            margin-left: auto;
            font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        }
        .log-card-body {
            display: none;
            border-top: 1px solid #E8EAEF;
            background: #F7F8FA;
            flex: 1;
            display: none;
            flex-direction: column;
        }
        .log-card.expanded .log-card-body {
            display: flex;
        }
        .log-card-section {
            padding: 10px 12px;
            flex-shrink: 0;
        }
        .log-card-section:last-child {
            flex: 1;
            min-height: 0;
        }
        .log-card-section:last-child .log-card-json {
            flex: 1;
            max-height: none;
            min-height: 200px;
        }
        .log-card-section + .log-card-section {
            border-top: 1px solid #E8EAEF;
        }
        .log-card-section-title {
            font-size: 11px;
            color: #8F959E;
            margin-bottom: 6px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }
        .log-card-section-title .section-toggle {
            font-size: 10px;
            color: #8F959E;
            transition: transform 0.2s;
            display: inline-block;
            transform: rotate(-90deg);
        }
        .log-card-section:not(.collapsed) .section-toggle {
            transform: rotate(0deg);
        }
        .log-card-section.collapsed .log-card-json,
        .log-card-section.collapsed .log-card-session {
            display: none;
        }
        .log-card-section-title .copy-btn {
            font-size: 11px;
            color: #2E5BE6;
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
            padding: 1px 6px;
            border: 1px solid #E8EAEF;
            border-radius: 4px;
            background: #fff;
            transition: all 0.15s;
        }
        .log-card-section-title .copy-btn:hover {
            background: #EEF3FE;
            border-color: #2E5BE6;
        }
        .log-card-section-title .copy-btn.copied {
            color: #16A34A;
            border-color: #16A34A;
        }
        .log-card-json {
            font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            color: #1F2329;
            background: #fff;
            border: 1px solid #E8EAEF;
            border-radius: 6px;
            padding: 8px 10px;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 120px;
            max-height: 350px;
            overflow-y: auto;
            line-height: 1.5;
        }
        .log-card-session {
            font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            color: #2E5BE6;
            background: #EEF3FE;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .log-card-empty {
            padding: 24px;
            text-align: center;
            color: #D8DBE1;
            font-size: 13px;
        }

        .error-message {
            background: #FDECEA;
            border: 1px solid #F2C6C2;
            border-radius: 6px;
            padding: 12px 16px;
            color: #CF3A31;
            display: none;
            margin-bottom: 16px;
        }

        .error-message.show {
            display: block;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: #1F2329;
            color: #fff;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.warn {
            background: #D97706;
        }

        .search-hint {
            font-size: 12px;
            color: #CF3A31;
            margin-left: 8px;
        }

        /* 批量选择相关样式 */
        .batch-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #E8EAEF;
            background: #fff;
        }

        .batch-toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .batch-toolbar .selection-info {
            font-size: 13px;
            color: #8F959E;
        }

        .batch-toolbar .selection-info .count {
            color: #2E5BE6;
            font-weight: 600;
        }

        .btn-batch-export {
            height: 32px;
            padding: 0 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #2E5BE6;
            background: #2E5BE6;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-batch-export:hover {
            background: #1F48C4;
            border-color: #1F48C4;
        }

        .btn-batch-export:disabled {
            background: #D8DBE1;
            border-color: #D8DBE1;
            cursor: not-allowed;
        }

        .data-table th.col-checkbox,
        .data-table td.col-checkbox {
            width: 40px;
            text-align: center;
            padding: 12px 8px;
        }

        .data-table input[type="checkbox"] {
            accent-color: #2E5BE6;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

    <div class="toast" id="toast"></div>
    <header class="header">
        <div class="header-left">
            <img src="logo.png" alt="道旅" class="logo" style="height: 36px;">
            <div class="breadcrumb">
                <span>运营工具</span>
                <span class="breadcrumb-separator">/</span>
                <span>渠道日志系统</span>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="nav-item active">🔍 渠道日志查询</div>
        </aside>

        <main class="content">
            <div class="search-panel">
                <div class="error-message" id="errorMessage">️ 订单号不存在，请检查后重试</div>

                <div class="search-form">
                    <div class="form-row span-2">
                        <label class="form-label">订单号 <span class="search-hint">输入订单号或选择日期范围后点击查询</span></label>
                        <input type="text" class="form-input" placeholder="渠道/道旅/供应商订单号" id="orderNumber">
                    </div>

                    <div class="form-row span-2">
                        <label class="form-label">日期范围</label>
                        <div class="date-range-container">
                            <div class="date-range-input" id="dateRangeWrapper">
                                <input type="text" class="range-input" id="dateInputStart" placeholder="开始日期" readonly>
                                <span class="range-separator">
                                    <svg viewBox="0 0 1024 1024" width="14" height="14"><path d="M256 512a32 32 0 0 1 55.4-21.7l160 176a32 32 0 0 1 0 43.4l-160 176A32 32 0 0 1 264 864V512z" fill="currentColor"/></svg>
                                </span>
                                <input type="text" class="range-input" id="dateInputEnd" placeholder="结束日期" readonly>
                                <span class="range-calendar-icon" onclick="toggleDatePanel()">
                                    <svg viewBox="0 0 1024 1024" width="16" height="16"><path d="M880 184H712v-64c0-4.4-3.6-8-8-8h-56c-4.4 0-8 3.6-8 8v64H384v-64c0-4.4-3.6-8-8-8h-56c-4.4 0-8 3.6-8 8v64H144c-17.7 0-32 14.3-32 32v664c0 17.7 14.3 32 32 32h736c17.7 0 32-14.3 32-32V216c0-17.7-14.3-32-32-32zm-40 656H184V460h656v380zM184 392V256h128v48c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8v-48h256v48c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8v-48h128v136H184z"/></svg>
                                </span>
                            </div>

                            <div class="date-picker-panel" id="datePickerPanel">
                                <div class="quick-date-options">
                                    <button class="quick-date-btn" onclick="setDateRange(7)">近 7 天</button>
                                    <button class="quick-date-btn" onclick="setDateRange(30)">近 30 天</button>
                                    <button class="quick-date-btn active" onclick="setDateRange(30)">近 30 天</button>
                                    <button class="quick-date-btn" onclick="setDateRange(90)">近 90 天</button>
                                </div>

                                <div class="calendar-container">
                                    <div class="calendar-month">
                                        <div class="calendar-header">
                                            <div class="calendar-nav">
                                                <button class="calendar-nav-btn" onclick="navMonth(-12)">«</button>
                                                <button class="calendar-nav-btn" onclick="navMonth(-1)">‹</button>
                                            </div>
                                            <span class="calendar-header-title" id="leftMonthTitle">2026 年 10 月</span>
                                            <div class="calendar-nav"></div>
                                        </div>
                                        <div class="calendar-weekdays">
                                            <div class="calendar-weekday">一</div>
                                            <div class="calendar-weekday">二</div>
                                            <div class="calendar-weekday">三</div>
                                            <div class="calendar-weekday">四</div>
                                            <div class="calendar-weekday">五</div>
                                            <div class="calendar-weekday">六</div>
                                            <div class="calendar-weekday">日</div>
                                        </div>
                                        <div class="calendar-days" id="leftMonthDays"></div>
                                    </div>

                                    <div class="calendar-month">
                                        <div class="calendar-header">
                                            <div class="calendar-nav"></div>
                                            <span class="calendar-header-title" id="rightMonthTitle">2026 年 11 月</span>

                                            <div class="calendar-weekday">日</div>

                        </div>
                    </div>

                                <label><input type="checkbox" name="logType" value="query" onchange="updateLogTypeDisplay()"> 查单</label>
                            </div>
                        </div>
                    </div>

                    <div class="advanced-filters" id="advancedFilters">
                        <div class="form-row span-2">
                            <label class="form-label">错误码 (errorCode)</label>
                            <input type="text" class="form-input" placeholder="可选" id="errorCode">
                        </div>

                        <div class="form-row span-2">
                            <label class="form-label">ClientID</label>
                            <input type="text" class="form-input" placeholder="可选" id="clientId">
                        </div>

                        <div class="form-row span-2">
                            <label class="form-label">SupplierID</label>
                            <input type="text" class="form-input" placeholder="可选" id="supplierId">
                        </div>

                        <div class="form-row span-2">
                            <label class="form-label">DidaHotelID</label>
                            <input type="text" class="form-input" placeholder="可选" id="didaHotelId">
                        </div>

                            <label class="form-label">RatePlanID</label>
                            <input type="text" class="form-input" placeholder="可选" id="ratePlanId">
                        </div>
                    </div>

                </div>

                <div class="toggle-advanced" id="toggleAdvanced" onclick="toggleAdvancedFilters()">

                                <th width="140">供应商订单号</th>
                                <th width="100">订单状态</th>

                                <th width="160">最新日志时间</th>
                                <th width="120">ClientID</th>
                                <th width="120">SupplierID</th>
                                <th width="120">操作</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody">
                        </tbody>
                    </table>
                </div>

                <div id="pagination" class="pagination">
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="detailModal">

        // Pagination state

        // Log type labels and colors

        };

        let selectedStart = null;
        let selectedEnd = null;
        let calLeftYear, calLeftMonth;
        let activeDateTarget = 'start'; // 'start' or 'end'

        function formatDate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function setDateRange(days, event) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const startDate = new Date(today);
            startDate.setDate(startDate.getDate() - days + 1);

            selectedStart = startDate;
            selectedEnd = today;

            document.getElementById('dateInputStart').value = formatDate(startDate);
            document.getElementById('dateInputEnd').value = formatDate(today);

            calLeftYear = startDate.getFullYear();
            calLeftMonth = startDate.getMonth();
            renderCalendar();

            document.querySelectorAll('.quick-date-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // Find the button with matching days
                document.querySelectorAll('.quick-date-btn').forEach(btn => {
                    if (btn.textContent.includes(days)) btn.classList.add('active');
                });
            }
        }

        function navMonth(delta) {
            calLeftMonth += delta;
            if (calLeftMonth > 11) {
                calLeftYear += Math.floor(calLeftMonth / 12);
                calLeftMonth = calLeftMonth % 12;
            } else if (calLeftMonth < 0) {
                const yearsBack = Math.ceil(Math.abs(calLeftMonth) / 12);
                calLeftYear -= yearsBack;
                calLeftMonth = ((calLeftMonth % 12) + 12) % 12;
            }
            renderCalendar();
        }

        function toggleDatePanel(target) {

        function updateInputFocus() {

            startInput.classList.toggle('active', activeDateTarget === 'start');

        function clearInputFocus() {

        }

        function renderCalendar() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (!selectedStart) {
                const now = new Date();
                calLeftYear = now.getFullYear();
                calLeftMonth = now.getMonth();
            }

            const leftMonth = new Date(calLeftYear, calLeftMonth, 1);
            const rightMonth = new Date(calLeftYear, calLeftMonth + 1, 1);

            renderMonth('left', leftMonth, today);
            renderMonth('right', rightMonth, today);
        }

        function renderMonth(side, monthDate, today) {
            const year = monthDate.getFullYear();
            const month = monthDate.getMonth();

            document.getElementById(side + 'MonthTitle').textContent = year + '年 ' + (month + 1) + '月';

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            // 周一为起始: 0=Mon ... 6=Sun
            const startDayOfWeek = (firstDay.getDay() + 6) % 7;
            const totalDays = lastDay.getDate();

            const prevMonthLastDay = new Date(year, month, 0).getDate();

            const container = document.getElementById(side + 'MonthDays');
            container.innerHTML = '';

            // 上月日期
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                const day = prevMonthLastDay - i;
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day other-month';
                dayEl.textContent = day;
                container.appendChild(dayEl);
            }

            // 当月日期
            for (let day = 1; day <= totalDays; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';
                dayEl.textContent = day;
                dayEl.dataset.dateStr = new Date(year, month, day).toDateString();

                const currentDate = new Date(year, month, day);
                const dayOfWeek = currentDate.getDay();

                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    dayEl.classList.add('weekend');
                }

                if (currentDate.toDateString() === today.toDateString()) {
                    dayEl.classList.add('today');
                }

                if (selectedStart && currentDate.toDateString() === selectedStart.toDateString()) {
                    dayEl.classList.add('selected');
                }

                if (selectedEnd && currentDate.toDateString() === selectedEnd.toDateString()) {
                    dayEl.classList.add('selected');
                }

                if (selectedStart && selectedEnd && currentDate > selectedStart && currentDate < selectedEnd) {
                    dayEl.classList.add('in-range');
                }

                container.appendChild(dayEl);
            }

            // 下月日期（补齐行数）
            const totalCells = startDayOfWeek + totalDays;
            const rows = Math.ceil(totalCells / 7);
            const remaining = rows * 7 - totalCells;
            for (let day = 1; day <= remaining; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day other-month';
                dayEl.textContent = day;
                container.appendChild(dayEl);
            }
        }

        function handleDateClick(dateStr) {
            const clicked = new Date(dateStr);
            clicked.setHours(0, 0, 0, 0);

            if (activeDateTarget === 'start') {
                selectedStart = new Date(clicked);
                selectedEnd = null;
                activeDateTarget = 'end';
            } else {
                if (clicked.getTime() < selectedStart.getTime()) {
                    selectedEnd = new Date(selectedStart);
                    selectedStart = clicked;
                } else {
                    selectedEnd = clicked;
                }
                activeDateTarget = 'start';
            }

            document.getElementById('dateInputStart').value = selectedStart ? formatDate(selectedStart) : '';
            document.getElementById('dateInputEnd').value = selectedEnd ? formatDate(selectedEnd) : '';

            updateInputFocus();
            renderCalendar();

            if (selectedStart && selectedEnd) {
                setTimeout(() => {
                    document.getElementById('datePickerPanel').classList.remove('show');
                    clearInputFocus();
                }, 100);
            }
        }

        // Date input change handlers (manual typing)
        function parseDateInput(val) {
            const match = val.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (!match) return null;
            const d = new Date(+match[1], +match[2] - 1, +match[3]);
            if (isNaN(d.getTime())) return null;
            return d;
        }

        document.getElementById('dateInputStart').addEventListener('change', function() {
            const d = parseDateInput(this.value);
            if (d) {
                selectedStart = d;
                this.value = formatDate(d);
                calLeftYear = d.getFullYear();
                calLeftMonth = d.getMonth();

        function searchLogs() {
            const orderNumberInput = document.getElementById('orderNumber').value.trim();
            const startDate = document.getElementById('dateInputStart').value.trim();
            const endDate = document.getElementById('dateInputEnd').value.trim();

            const selectedLogTypes = getSelectedLogTypes();
            const clientId = document.getElementById('clientId').value.trim();
            const supplierId = document.getElementById('supplierId').value.trim();
            const errorCode = document.getElementById('errorCode').value.trim();
            const didaHotelId = document.getElementById('didaHotelId').value.trim();
            const ratePlanId = document.getElementById('ratePlanId').value.trim();

            // Filter logs first
            const matchedLogs = MOCK_LOGS.filter(log => {
                // 订单号匹配：三端 ID 任一命中即匹配
                if (orderNumberInput) {
                    const matchOid = log.oid && log.oid.includes(orderNumberInput);
                    const matchCoid = log.coid && log.coid.includes(orderNumberInput);
                    const matchSoid = log.soid && log.soid.includes(orderNumberInput);
                    if (!matchOid && !matchCoid && !matchSoid) return false;
                } else {
                    // 没有订单号时，按日期范围筛选（字符串比较，YYYY-MM-DD 格式天然有序）
                    if (startDate && endDate) {
                        const logDate = log.t.split(' ')[0]; // 取日期部分 "2026-09-29"
                        if (logDate < startDate || logDate > endDate) return false;
                    }
                }
                if (selectedLogTypes.length > 0 && !selectedLogTypes.includes(log.lt)) return false;
                if (clientId && !log.cid.toLowerCase().includes(clientId.toLowerCase())) return false;
                if (supplierId && !log.sid.toLowerCase().includes(supplierId.toLowerCase())) return false;
                if (errorCode && log.ec !== errorCode) return false;
                if (didaHotelId && log.dhid !== didaHotelId) return false;
                if (ratePlanId && log.rpid !== ratePlanId) return false;
                return true;
            });

            // Group by order (use oid as primary key, fallback to coid or soid)
            const orderMap = new Map();
            matchedLogs.forEach(log => {
                // Use oid as the primary key; if empty, use coid; if both empty, use soid
                const key = log.oid || log.coid || log.soid || `verify_${log.id}`;
                if (!orderMap.has(key)) {
                    orderMap.set(key, { logs: [], coid: log.coid, soid: log.soid, oid: log.oid });
                }
                const entry = orderMap.get(key);
                entry.logs.push(log);
                // Keep non-empty IDs
                if (log.coid && !entry.coid) entry.coid = log.coid;
                if (log.soid && !entry.soid) entry.soid = log.soid;
                if (log.oid && !entry.oid) entry.oid = log.oid;
            });

            // Build order list
            filteredOrders = Array.from(orderMap.entries()).map(([oid, { logs, coid, soid }]) => {
                // Determine order status
                const hasCancel = logs.some(l => l.lt === 'cancel');
                const hasOrder = logs.some(l => l.lt === 'order');
                const hasFailed = logs.some(l => l.st === 'fail');

                let status = '验价中';
                if (hasCancel) status = '已取消';
                else if (hasOrder && !hasCancel) status = '已确认';
                else if (hasFailed) status = '失败';

                // Collect unique log types
                const logTypes = [...new Set(logs.map(l => l.lt))];

                // Get latest time
                const latestTime = logs.reduce((max, l) => l.t > max ? l.t : max, '');

                // Get first clientId and supplierId
                const clientIdVal = logs[0].cid;
                const supplierIdVal = logs[0].sid;

                return {
                    oid: oid,
                    coid: coid || '',
                    soid: soid || '',
                    status,
                    logTypes,
                    time: latestTime,
                    clientId: clientIdVal,
                    supplierId: supplierIdVal,
                    logs
                };
            });

            currentPage = 1;
            selectedOrderIds.clear();
            updateSelectionUI();
            renderTable();
            renderPagination();
            updateResultCount();

            // 如果是按单号查询且只有一个结果，自动打开详情弹窗
            if (orderNumberInput && filteredOrders.length === 1) {
                viewDetail(filteredOrders[0].oid);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('orderTableBody');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageOrders = filteredOrders.slice(start, end);

            tbody.innerHTML = pageOrders.map(order => {
                // Status badge
                let statusClass = '';
                if (order.status === '已取消') statusClass = 'order-status-cancelled';
                else if (order.status === '已确认') statusClass = 'order-status-confirmed';
                else if (order.status === '失败') statusClass = 'order-status-failed';

                // Log type badges
                const logTypeBadges = order.logTypes.map(lt => {
                    const typeInfo = LOG_TYPE_MAP[lt] || { label: lt, class: '' };
                    return `<span class="log-type-badge ${typeInfo.class}">${typeInfo.label}</span>`;
                }).join(' ');

                const isChecked = selectedOrderIds.has(order.oid) ? 'checked' : '';

                return `<tr>
                    <td class="col-checkbox"><input type="checkbox" ${isChecked} onchange="toggleOrderSelect('${order.oid}', this.checked)"></td>
                    <td title="${order.coid}">${order.coid || '-'}</td>
                    <td title="${order.oid}">${order.oid || '-'}</td>
                    <td title="${order.soid}">${order.soid || '-'}</td>
                    <td><span class="order-status ${statusClass}">${order.status}</span></td>
                    <td>${logTypeBadges}</td>
                    <td>${order.time}</td>
                    <td>${order.clientId}</td>
                    <td>${order.supplierId}</td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <a class="action-link" onclick="viewDetail('${order.oid}')">详情</a>
                            <a class="action-link" onclick="exportOrder('${order.oid}')">导出</a>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            // Update select-all checkbox state
            updateSelectAllCheckbox();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredOrders.length / pageSize);
            const pagination = document.getElementById('pagination');

            let html = `<span style="color: #8F959E; font-size: 13px;">共 ${filteredOrders.length} 条，共 ${totalPages || 1} 页</span>`;

            // Page size selector
            html += `<select class="page-size-select" onchange="changePageSize(this.value)">`;
            [10, 20, 50, 100].forEach(s => {
                html += `<option value="${s}" ${s === pageSize ? 'selected' : ''}>${s} 条/页</option>`;
            });
            html += `</select>`;

            if (totalPages > 1) {
                html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">&lt;</button>`;

                for (let i = 1; i <= Math.min(5, totalPages); i++) {
                    html += `<button class="pagination-btn ${currentPage === i ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }

                if (totalPages > 5) {

        // 生成单条日志卡片HTML
        function buildLogCard(log, side) {
            const ltInfo = LOG_TYPE_MAP[log.lt] || { label: log.lt };
            const statusLabel = log.st === 'success' ? 'success' : 'failed';
            const statusCls = log.st === 'success' ? 'success' : 'fail';

            // 取消类型特殊处理：展示两步流程
            if (log.lt === 'cancel') {
                return buildCancelCard(log, side, ltInfo, statusLabel, statusCls);
            }

            const reqJson = side === 'client' ? buildClientRequest(log) : (side === 'didaSS' ? buildDidaSSRequest(log) : buildSupplierRequest(log));
            const resJson = side === 'client' ? buildClientResponse(log) : (side === 'didaSS' ? buildDidaSSResponse(log) : buildSupplierResponse(log));

            return `
                <div class="log-card">
                    <div class="log-card-header">
                        <span class="log-card-toggle">▶</span>
                        <span class="log-card-type ${log.lt}">${ltInfo.label}</span>
                        <span class="log-card-status ${statusCls}">${statusLabel}</span>

                    <div class="log-card-body">

                            <span class="log-card-session">${log.ss || '-'}</span>

                                <span class="copy-btn" onclick="event.stopPropagation(); copyJson(this)">📋 Copy</span>

        // 复制JSON内容
        function copyJson(btn) {
            const jsonEl = btn.closest('.log-card-section').querySelector('.log-card-json');
            if (!jsonEl) return;
            const text = jsonEl.textContent;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✅ Copied';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 1500);
            }).catch(() => {
                // Fallback for older browsers
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✅ Copied';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 1500);
            });
        }

                            Contact: { Name: { First: "Wei", Last: "Zhang" }, Phone: "02180636046", Email: "booking@" + log.cid.toLowerCase() + ".com" },
                            ClientReference: log.coid,
                            ConfirmationCode: log.soid,
                            Hotel: {
                                HotelID: parseInt(log.dhid) || 2067,
                                HotelName: "Sample Hotel",
                                Destination: { CityCode: "178294" },
                                RatePlanList: [{ RoomOccupancy: { RoomNum: 1, AdultCount: 2, ChildCount: 0 }, RoomTypeID: Math.floor(Math.random()*99999999), RoomName: "Standard Room, 2 Double Beds", RatePlanID: log.rpid || "-8026641818595821663", BedType: 6, BreakfastType: 2, RoomStatus: 1, Currency: "USD", TotalPrice: parseFloat((300 + Math.random() * 1500).toFixed(2)) }]
                            }
                        }]
                    }
                }, null, 2);
            }
        }

        // ====== Dida→供应商 的 request 报文 ======
        function buildSupplierRequest(log) {
            if (log.lt === 'verify') {
                return JSON.stringify({
                    action: "SearchHotel",
                    hotelId: log.shid,
                    checkIn: "2026-10-19",
                    checkOut: "2026-10-23",
                    rooms: [{ adults: 2, children: 0 }],
                    currency: "USD",
                    supplierCode: log.sup
                }, null, 2);
            } else if (log.lt === 'order') {
                return JSON.stringify({
                    action: "BookHotel",
                    hotelId: log.shid,
                    roomId: log.rpid || "N/A",
                    checkIn: "2026-10-19",
                    checkOut: "2026-10-23",
                    guestName: "Zhang Wei",
                    supplierCode: log.sup,
                    didaBookingId: log.oid,
                    paymentType: "VCC"
                }, null, 2);
            } else if (log.lt === 'cancel') {
                // 取消第二步：HotelBookingCancelConfirm（确认取消）
                return JSON.stringify({
                    action: "CancelBooking",
                    supplierCode: log.sup,
                    supplierBookingId: log.soid,
                    confirmCancel: true
                }, null, 2);
            } else {
                return JSON.stringify({
                    action: "QueryBooking",
                    supplierCode: log.sup,
                    supplierBookingId: log.soid
                }, null, 2);
            }
        }

        // ====== Dida→供应商 的 response 报文 ======
        function buildSupplierResponse(log) {
            if (log.st === 'fail') {
                return JSON.stringify({
                    success: false,
                    errorCode: log.ec || "SUPPLIER_ERROR",
                    errorMsg: "Supplier returned an error",
                    supplierCode: log.sup
                }, null, 2);
            }
            if (log.lt === 'verify') {
                const rate = (250 + Math.random() * 1200).toFixed(2);
                return JSON.stringify({
                    success: true,
                    available: true,
                    hotelId: log.shid,
                    roomId: log.rpid || "RT" + Math.floor(Math.random()*99999),
                    rate: { currency: "USD", totalAmount: parseFloat(rate), dailyRates: [0,1,2,3].map(i => ({ date: `2026-10-${19+i}`, amount: parseFloat((rate/4).toFixed(2)) })) },
                    cancellationPolicy: { freeCancellationBefore: "2026-10-17", penaltyAmount: parseFloat(rate) }
                }, null, 2);
            } else if (log.lt === 'order') {
                return JSON.stringify({
                    success: true,
                    supplierBookingId: log.soid || "SUP" + Math.floor(Math.random()*99999999),
                    confirmationNumber: "CONF" + Math.floor(Math.random()*99999999),
                    status: "Confirmed",
                    hotelId: log.shid,
                    supplierCode: log.sup
                }, null, 2);
            } else if (log.lt === 'cancel') {
                return JSON.stringify({
                    success: true,
                    supplierBookingId: log.soid,
                    status: "Cancelled",
                    supplierCode: log.sup
                }, null, 2);
            } else {
                return JSON.stringify({
                    success: true,
                    supplierBookingId: log.soid,
                    status: "Confirmed",
                    checkIn: "2026-10-19",
                    checkOut: "2026-10-23",
                    supplierCode: log.sup
                }, null, 2);
            }
        }

        // ====== Dida→SS 的 request 报文 ======
        function buildDidaSSRequest(log) {
            if (log.lt === 'verify') {
                return JSON.stringify({
                    action: "RateSearch",
                    sessionId: log.ss,
                    hotelId: log.dhid,
                    supplierHotelId: log.shid,
                    checkIn: "2026-10-19",
                    checkOut: "2026-10-23",
                    rooms: [{ adults: 2, children: 0, roomIndex: 1 }],
                    currency: "USD",
                    supplierCode: log.sid,
                    supplierName: log.sup,
                    ratePlanId: log.rpid || "RP" + Math.floor(Math.random()*99999),
                    requestId: "REQ_" + log.id + "_" + Date.now()
                }, null, 2);
            } else if (log.lt === 'order') {
                return JSON.stringify({
                    action: "BookRoom",
                    sessionId: log.ss,
                    didaBookingId: log.oid,
                    clientBookingRef: log.coid,
                    hotelId: log.dhid,
                    supplierHotelId: log.shid,
                    roomId: log.rpid || "RT" + Math.floor(Math.random()*99999),
                    checkIn: "2026-10-19",
                    checkOut: "2026-10-23",
                    guestName: "Zhang Wei",
                    guestEmail: "guest@dida.travel",
                    supplierCode: log.sid,
                    supplierName: log.sup,
                    paymentMethod: "VCC",
                    totalAmount: parseFloat((300 + Math.random() * 1500).toFixed(2)),
                    currency: "USD"
                }, null, 2);
            } else if (log.lt === 'cancel') {
                return JSON.stringify({
                    action: "CancelBooking",
                    sessionId: log.ss,
                    didaBookingId: log.oid,
                    supplierBookingId: log.soid,
                    supplierCode: log.sid,
                    supplierName: log.sup,
                    reason: "Client requested cancellation",
                    cancellationFee: 0
                }, null, 2);
            } else {
                return JSON.stringify({
                    action: "QueryBooking",
                    sessionId: log.ss,
                    didaBookingId: log.oid,
                    supplierBookingId: log.soid,
                    supplierCode: log.sid,
                    supplierName: log.sup
                }, null, 2);
            }
        }

        // ====== Dida→SS 的 response 报文 ======
        function buildDidaSSResponse(log) {
            if (log.st === 'fail') {
                return JSON.stringify({
                    success: false,
                    errorCode: log.ec || "SS_ERROR",
                    errorMsg: "SS layer processing failed",
                    sessionId: log.ss,
                    supplierCode: log.sid,
                    timestamp: log.t.replace(' ', 'T') + "+08:00"
                }, null, 2);
            }
            if (log.lt === 'verify') {
                const rate = (280 + Math.random() * 1400).toFixed(2);
                return JSON.stringify({
                    success: true,
                    available: true,
                    sessionId: log.ss,
                    hotelId: log.dhid,
                    supplierHotelId: log.shid,
                    roomId: log.rpid || "RT" + Math.floor(Math.random()*99999),
                    rate: {
                        currency: "USD",
                        totalAmount: parseFloat(rate),
                        dailyRates: [0,1,2,3].map(i => ({ date: `2026-10-${19+i}`, amount: parseFloat((rate/4).toFixed(2)) }))
                    },
                    cancellationPolicy: {
                        freeCancellationBefore: "2026-10-17T23:59:59",
                        penaltyType: "percentage",
                        penaltyAmount: 100
                    },
                    supplierCode: log.sid,
                    supplierName: log.sup,
                    responseTime: Math.floor(150 + Math.random() * 800) + "ms"
                }, null, 2);
            } else if (log.lt === 'order') {
                return JSON.stringify({
                    success: true,
                    sessionId: log.ss,
                    didaBookingId: log.oid,
                    supplierBookingId: log.soid || "SUP" + Math.floor(Math.random()*99999999),
                    confirmationNumber: "CONF" + Math.floor(Math.random()*99999999),
                    status: "Confirmed",
                    hotelId: log.dhid,
                    supplierHotelId: log.shid,
                    supplierCode: log.sid,
                    supplierName: log.sup,
                    bookingTime: log.t.replace(' ', 'T') + "+08:00"
                }, null, 2);
            } else if (log.lt === 'cancel') {
                return JSON.stringify({
                    success: true,
                    sessionId: log.ss,
                    didaBookingId: log.oid,
                    supplierBookingId: log.soid,
                    status: "Cancelled",
                    cancellationTime: log.t.replace(' ', 'T') + "+08:00",
                    supplierCode: log.sid,
                    supplierName: log.sup
                }, null, 2);
            } else {
                return JSON.stringify({
                    success: true,
                    sessionId: log.ss,
                    didaBookingId: log.oid,
                    supplierBookingId: log.soid,
                    status: "Confirmed",
                    checkIn: "2026-10-19",
                    checkOut: "2026-10-23",
                    supplierCode: log.sid,
                    supplierName: log.sup,
                    lastUpdated: log.t.replace(' ', 'T') + "+08:00"
